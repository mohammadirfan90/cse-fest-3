#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # ---- 1. Rate Limiting Zones (Increased global_limit rate to 100r/s to prevent asset throttling) ----
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

    # ---- HTTP Server Block (Redirects public traffic to secure HTTPS) ----
    server {
        listen 80;
        server_name csefest.smuct.ac.bd;

        # Enforce upload limits (allows large uploads up to 250MB)
        client_max_body_size 250M;

        # Fix 502 Bad Gateway from large Supabase auth cookies
        proxy_buffer_size 256k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        large_client_header_buffers 4 32k;

        # Certbot webroot challenge validation location
        location /.well-known/acme-challenge/ {
            root C:/acme-challenge;
        }    

        # Redirect all other HTTP traffic to secure HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS Server Block ----
    server {
        listen 443 ssl http2;
        server_name csefest.smuct.ac.bd;

        # SSL Certificates
        ssl_certificate C:/certs/csefest/csefest.smuct.ac.bd-chain.pem;
        ssl_certificate_key C:/certs/csefest/csefest.smuct.ac.bd-key.pem;

        # Enforce upload limits (allows large student ID uploads & submissions up to 250MB)
        client_max_body_size 250M;

        # Optimized proxy buffers for HTTPS
        # This prevents 502 Bad Gateway when Supabase emits large auth cookie headers (~4.5KB each)
        proxy_buffer_size 256k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        large_client_header_buffers 4 32k;

        # 2. Main Site Routing (Applies global rate limit zone - relaxed limits)
        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Limits normal dynamic traffic to 100 requests/sec with a burst tolerance of 150
            limit_req zone=global_limit burst=150 nodelay;
        }

        # 3. Auth Location Block (Applies strict rate limits to auth calls)
        location /api/auth/ {
            limit_req zone=auth_limit burst=5;
            
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # 4. Upload Location Block (Applies upload rate limits to file uploads)
        location /api/submissions/upload {
            limit_req zone=upload_limit burst=3;
            
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # 5. Bypass rate limiting for Next.js assets, pre-fetches, and static chunks
        location /_next/ {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 6. Bypass rate limiting for general static files (images, css, js, icons)
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?|webp)$ {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
