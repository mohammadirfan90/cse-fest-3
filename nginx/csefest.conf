#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # ---- HTTP Server Block (Redirects public traffic to secure HTTPS) ----
    server {
        listen 80;
        server_name csefest.smuct.ac.bd;

        # Enforce upload limits (250MB for video/proposal submissions)
        client_max_body_size 250M;

        # Fix 502 Bad Gateway from large Supabase auth cookies (on HTTP fallback)
        proxy_buffer_size 256k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        large_client_header_buffers 4 32k;

        # Certbot webroot challenge validation location
        location /.well-known/acme-challenge/ {
            root C:/acme-challenge;
        }    

        # Redirect all other HTTP traffic to secure HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS Server Block (Corrected with optimized proxy buffers & upload limits) ----
    server {
        listen 443 ssl http2;
        server_name csefest.smuct.ac.bd;

        # SSL Certificates
        ssl_certificate C:/certs/csefest/csefest.smuct.ac.bd-chain.pem;
        ssl_certificate_key C:/certs/csefest/csefest.smuct.ac.bd-key.pem;

        # Enforce upload limits (allows large student ID uploads & submissions up to 250MB)
        client_max_body_size 250M;

        # FIX: Optimized proxy buffers for HTTPS
        # This prevents 502 Bad Gateway when Supabase emits large auth cookie headers (~4.5KB each)
        proxy_buffer_size 256k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        large_client_header_buffers 4 32k;

        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
