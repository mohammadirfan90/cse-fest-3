# Nginx configuration for CSE Fest 2026
# Path: /etc/nginx/sites-available/csefest

# -----------------------------------------------------------------------------
# 1. Rate Limiting Zones (Place inside the http block of /etc/nginx/nginx.conf)
# -----------------------------------------------------------------------------
# limit_req_zone $binary_remote_addr zone=global_limit:10m rate=15r/s;
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

# -----------------------------------------------------------------------------
# 2. HTTP Server Block (Redirect to HTTPS)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name csefest.smuct.edu.bd;

    # Certbot webroot challenges path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 3. HTTPS Server Block
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name csefest.smuct.edu.bd;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/csefest.smuct.edu.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csefest.smuct.edu.bd/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Enforce University VM File Upload Limits (hard limit 250MB)
    client_max_body_size 250M;

    # -----------------------------------------------------------------------------
    # 4. Security Headers
    # -----------------------------------------------------------------------------
    # Prevent Frame nesting (Clickjacking protection)
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection filter
    add_header X-XSS-Protection "1; mode=block" always;

    # Strict Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Strict Transport Security (HSTS) - 2 years validity
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Permissions Policy (restrict sensitive browser APIs)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # -----------------------------------------------------------------------------
    # 5. Reverse Proxy for Next.js Application
    # -----------------------------------------------------------------------------
    # NOTE: Supabase SSR chunked auth cookies (sb-<ref>-auth-token.0 + .1)
    # produce ~4.5 KB per Set-Cookie line. Two lines + six security headers
    # + Date/Server/Transfer-Encoding routinely exceed the platform default
    # proxy_buffer_size (4k on 32-bit, 8k on 64-bit). Nginx's response to that
    # is the exact error "upstream sent too big header while reading response
    # header from upstream". These overrides raise the buffer ceiling.
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- Header / response buffer fix (resolves 502 on GET /) ----
        proxy_buffer_size 32k;               # default 4k/8k — too small
        proxy_buffers 16 32k;                # default 8 4k/8k — too small
        proxy_busy_buffers_size 64k;         # default 4k/8k — too small
        large_client_header_buffers 4 32k;  # browser-sent URL/headers ceiling
        proxy_buffering on;
        proxy_hide_header X-Powered-By;     # strip Next.js branding (~50B)

        # Global API/Route rate limiting fallback
        limit_req zone=global_limit burst=30 nodelay;
    }

    # Custom rate-limiting locations for highly sensitive endpoints
    location /api/auth/ {
        limit_req zone=auth_limit burst=5;
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/submissions/upload {
        limit_req zone=upload_limit burst=3;
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------------------------------------
# 6. SSL Certificate Auto-Renewal & Testing Guidelines (Certbot)
# -----------------------------------------------------------------------------
# To set up Certbot for the first time:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d csefest.smuct.edu.bd
#
# To verify Certbot auto-renewal works:
#   sudo certbot renew --dry-run
#
# The dry run simulates the renewal process without making actual modifications
# to your active SSL configuration, verifying that the Cron/Systemd configuration is correct.
